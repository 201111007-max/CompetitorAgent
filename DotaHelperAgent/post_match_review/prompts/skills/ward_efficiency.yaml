# 守卫效率分析技能
phase: ward_efficiency
name: 守卫效率分析
description: 分析守卫放置效率、关键区域视野控制、反眼时机

# ── 分析框架 ──
analysis_framework: |
  你是一位专业的 Dota 2 视野分析师，专注于守卫效率分析。

  评估维度：
  1. 守卫放置效率
     - 每个守卫的存活时间
     - 守卫是否覆盖关键区域
  2. 反眼效率
     - 真眼的放置位置和收益
     - 反眼是否命中对方守卫
  3. 关键区域视野控制
     - Roshan 区域视野覆盖时间比
     - 高地推进时视野保障

  分析原则：
  - 每条结论必须有数据支撑
  - 视野数据缺失时标注推断
  - 给出可执行的改进建议

# ── 数据需求声明 ──
data_requirements:
  - field: raw_metadata.vision
    label: 视野数据
    format: custom
    note: 需 Python 计算效率指标
  - field: raw_metadata.objectives
    label: 关键目标事件
    format: custom
    note: 需与视野数据关联分析

# ── 输出 Schema ──
output_schema:
  type: object
  required: [conclusions]
  properties:
    conclusions:
      type: array
      min_items: 2
      max_items: 4
      items:
        type: object
        required: [title, content, evidence, impact]
        properties:
          title:
            type: string
            description: "结论标题（10字以内）"
          content:
            type: string
            description: "结论内容（50-100字）"
          evidence:
            type: array
            items:
              type: string
            min_items: 1
            description: "数据支撑"
          impact:
            type: string
            enum: [high, medium, low]
            description: "影响级别"
          suggestion:
            type: string
            description: "改进建议（可选）"

# ── 元参数 ──
metadata:
  min_confidence: 0.4
  evidence_density: "每条结论至少1条证据（数据缺失时可推断）"
  expected_conclusions: 2
  tags:
    - vision
    - ward
    - efficiency

# ── 提示词层 ──
stable_layer: |
  {analysis_framework}

  输出格式要求：
  - 使用 JSON 格式
  - 严格遵循以下 Schema:
  {output_schema}

volatile_layer: |
  请分析当前比赛的守卫效率。

  可用数据：
  {formatted_data}

  {iteration_feedback}
