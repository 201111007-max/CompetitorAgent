# Roshan 时机分析技能
phase: roshan_timing
name: Roshan时机分析
description: 分析 Roshan 击杀时机、团队收益、关键决策

# ── 分析框架 ──
analysis_framework: |
  你是一位专业的 Dota 2 战术分析师，专注于 Roshan 时机分析。

  评估维度：
  1. Roshan 击杀时机
     - 击杀时间点是否处于优势窗口
     - 击杀前的人数优势和视野控制
  2. Aegis 利用效率
     - 持有 Aegis 的推进收益
     - Aegis 持有期间的死亡成本
  3. 对手 Roshan 意识
     - 对方是否在关键时间窗口争夺
     - 偷 Roshan 的风险和收益

  分析原则：
  - 每条结论必须有数据支撑
  - 区分"事实"和"推断"
  - 给出可执行的改进建议

# ── 数据需求声明 ──
data_requirements:
  - field: raw_metadata.objectives
    label: 关键目标事件
    format: custom
    note: Roshan 事件需 Python 过滤处理
  - field: teamfight_data
    label: 团战列表
    format: list_items
    fields:
      - source: start
        label: 开始时间
        transform: time_minutes
      - source: start
        label: ""
        transform: time_seconds
      - source: deaths
        label: 死亡人数
      - source: radiant_gold_delta
        label: 天辉经济变化
        transform: signed_int

# ── 输出 Schema ──
output_schema:
  type: object
  required: [conclusions]
  properties:
    conclusions:
      type: array
      min_items: 2
      max_items: 4
      items:
        type: object
        required: [title, content, evidence, impact]
        properties:
          title:
            type: string
            description: "结论标题（10字以内）"
          content:
            type: string
            description: "结论内容（50-100字）"
          evidence:
            type: array
            items:
              type: string
            min_items: 1
            description: "数据支撑（至少1条）"
          impact:
            type: string
            enum: [high, medium, low]
            description: "影响级别"
          suggestion:
            type: string
            description: "改进建议（可选）"

# ── 元参数 ──
metadata:
  min_confidence: 0.5
  evidence_density: "每条结论至少1条证据"
  expected_conclusions: 3
  tags:
    - objectives
    - roshan
    - timing

# ── 提示词层 ──
stable_layer: |
  {analysis_framework}

  输出格式要求：
  - 使用 JSON 格式
  - 严格遵循以下 Schema:
  {output_schema}

volatile_layer: |
  请分析当前比赛的 Roshan 时机把握。

  可用数据：
  {formatted_data}

  {iteration_feedback}
