<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竞品分析 Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="chat">
  <header class="topbar">
    <h1>竞品分析 Agent</h1>
    <div class="top-actions">
      <button id="new-btn" class="ghost">新会话</button>
      <button id="stop-btn" class="danger" disabled>停止</button>
    </div>
  </header>

  <main id="messages" class="messages" role="log"></main>

  <footer class="composer">
    <textarea id="input" rows="2"
              placeholder="输入任务，如：分析 Cursor / 对比 Cursor 和 Cline / 普查所有 AI coding agent&#10;Enter 发送，Shift+Enter 换行"></textarea>
    <div class="composer-actions">
      <span id="status" class="status" hidden></span>
      <button id="send-btn">发送</button>
    </div>
  </footer>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/dompurify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
