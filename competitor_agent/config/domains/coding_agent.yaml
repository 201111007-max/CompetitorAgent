      home: "https://opencode.ai"
    external_refs:
      github_repo: "sst/opencode"
  # ── 国内竞品（设计文档 83 §3，2026-09-08 web 核实回填）──────────────
  - name: trae
    aliases: [trae-ai, trae ide]
