# Domain Pack: coding_agent（设计文档 79 §2.1 第一实例）
# 内容与下沉前的硬编码 dict / 注册表字面量**逐位等价**（现状等价改写 = 回归基线）。
# 任何行为差异都是 bug 而非特性（doc 79 §6.2）。
domain: coding_agent
category_label: "ai_coding_agent"
dimensions:
  - name: pricing
    description: "分析竞品定价：套餐档位、按量计费、月付/年付价格与成本场景估算。"
    tools: [web_extract, web_search, analyze_pricing]
    skills: [pricing_analysis, fact_verification, confidence_disclosure]
    data_sources:
      - name: official_pricing_page
        notes: "定价页变动频繁，引用需带 as_of"
  - name: feature
    description: "分析竞品核心功能矩阵与特性。"
    tools: [web_extract, web_search]
    skills: [feature_analysis, fact_verification, confidence_disclosure]
  - name: performance
    description: "分析竞品性能：榜单、延迟、胜率等基准数据。"
    tools: [web_extract, web_search, benchmark_scores]
    skills: [performance_analysis, fact_verification, confidence_disclosure]
    data_sources:
      - name: benchmark_scores
        notes: "官方榜单直连（doc 67/80）：引用须带 provenance 口径"
  - name: ecosystem
    description: "分析竞品生态：MCP server 数量、IDE/插件支持、GitHub 社区活跃度。"
    tools: [web_extract, web_search, github_stars, github_releases, github_commits]
    skills: [ecosystem_analysis, fact_verification, confidence_disclosure]
  - name: sentiment
    description: "分析竞品口碑：正负极性、社区评价。"
    tools: [web_extract, web_search, sentiment_sampling]
    skills: [sentiment_analysis, fact_verification, confidence_disclosure]
    data_sources:
      - name: sentiment_sampling
        notes: "结构化采样带样本量/时间窗（doc 67 §2.2）"
  - name: roadmap
    description: "分析竞品路线图与版本发布节奏。"
    tools: [web_extract, web_search, github_releases, github_commits]
    skills: [roadmap_analysis, fact_verification, confidence_disclosure]
registry_seeds:
