      pricing: "https://windsurf.com/pricing"
    external_refs:
      marketplace: "https://marketplace.visualstudio.com/items?itemName=Windsurf.windsurf"
  - name: aider
    aliases: [aider ai]
    official_links:
      home: "https://aider.chat"
      docs: "https://aider.chat/docs/"
    external_refs:
      github_repo: "Aider-AI/aider"
  - name: gemini-cli
    aliases: [gemini cli]
    official_links:
      home: "https://github.com/google-gemini/gemini-cli"
    external_refs:
      github_repo: "google-gemini/gemini-cli"
  - name: opencode
    aliases: []
