# 竞品分析 Agent 配置文件
# 参考 doc/configuration.md 各字段含义与默认值。

# ===== 基础配置 =====
api_base_url: "https://api.deepseek.com"
model: "deepseek-chat"
temperature: 0.1
max_tokens: 2048

# ===== LLM 可靠性（设计文档 36）+ 计价（设计文档 46）=====
# LLMClient 构造读取本 section（fallback_models/timeout/max_retries/pricing_per_1k），
# 重试与 fallback 透明生效；pricing_per_1k 为"美元/千 token"，按模型覆盖，缺省用内置近似。
llm:
  api_base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  fallback_models: []          # 主模型重试耗尽后的回退模型链，如 ["deepseek-reasoner"]
  timeout: 120                 # 单次调用超时（秒，连接+读）
  max_retries: 3               # 可重试错误（429/5xx/连接/超时）每个模型的最大重试次数
  pricing_per_1k:              # 计价（美元/千 token）：换模型时覆盖以得准确成本展示
    input: 0.0003
    output: 0.0006

# ===== 预算（BudgetController）=====
budget:
  max_iterations: 10          # 战术循环最大迭代轮数
  max_parallel_subagents: 4   # 并行子代理上限
  cost_limit_usd: 1.0         # 单次分析 LLM 成本上限（美元）
  token_high_water_mark: 120000  # 上下文 token 高水位，触发压缩
  token_compression_target: 80000 # 压缩后目标 token

# ===== 执行调度（并行缺口分析）=====
execution:
  mode: "single"              # single 串行（默认，兼容）；parallel 并行执行独立缺口
  max_parallel_subagents: 4   # 并行子代理上限

# ===== 维度清单 =====
dimensions:
  enabled: [feature, pricing, performance, ecosystem, sentiment, roadmap]

# ===== 数据源 =====
collector:
  cache_ttl_seconds: 86400
  max_retries: 2
  timeout_seconds: 20
  rate_limit_per_second: 2   # 每源限速（ToolGuard）
  use_playwright: false      # M1 关；M2 接入后按需开
  user_agent: "competitor-agent/0.1"
  # 外部源多源路由（设计文档 23）：默认关闭，保证无网络/无 Key 测试与 benchmark 不触发真实网络。
  # 有网络/Key 的真实运行环境打开 enable_external_sources 即可启用 GitHub/插件市场等外部源。
  enable_external_sources: false
  enable_github: true
  enable_marketplace: true
  enable_community: true
  enable_benchmark: true

# ===== 记忆 =====
memory:
  enabled: true
  data_dir: "~/.competitor_agent"   # 记忆/凭据库根目录
  session_ttl_days: 30
  skills_max_per_competitor: 50
  evolution_window: 30              # L4 成功率统计窗口（天）

# ===== 报告 =====
report:
  include_confidence: true
  include_evidence_urls: true
  output_dir: "~/.competitor_agent/reports/competitor"   # 仓库外，避免写入工作树
  export_json: true          # 结构化 JSON 导出（设计文档 28），与 .md 同目录同名
  comparison_dir: "~/.competitor_agent/reports/comparison"   # 比较报告品类矩阵 JSON 目录

# ===== 新鲜度 / 陈旧度（设计文档 26）=====
freshness:
  dimension_ttl_days:
    pricing: 7
    performance: 14
    feature: 30
    ecosystem: 30
    sentiment: 7
    roadmap: 14
  refresh_check_enabled: true    # refresh_stale 定时重爬开关

# ===== 多 Agent LLM 主导编排（设计文档 49）=====
# analyze() 主路径 = Lead ReAct 编排：make_plan → delegate 维度子 Agent → 复核工具 → Final Answer。
# 安全兜底（url_guard/注入防护/预算/取消/checkpoint/聚合渲染）保持代码，不进 LLM。
subagents:
  enabled: true            # analyze() 主路径 = Lead ReAct 编排
  max_concurrent: 3        # delegate 一次最大并发子 Agent 数（对齐 budget.max_parallel_subagents）
  timeout_seconds: 60      # 子 Agent 单次执行超时
tools:
  validate_facts: true     # 复核工具（事实/数值冲突核验）注册
  detect_conflict: true    # 跨维度冲突检测工具注册
  check_freshness: true    # 新鲜度查询工具注册
  select_source: true      # 选源工具注册（确定性候选由代码生成）

# ===== ReAct 循环（设计文档 56）=====
agent:
  max_history_steps: 8     # 工具步超过后折叠旧步为摘要（默认 8，不设 = 现状不变）

# ===== 可观测性 =====
observability:
  log_level: "INFO"

# ===== 安全（Web/MCP）=====
# auth_token 优先从环境变量 COMPETITOR_AUTH_TOKEN 读取，此处留空表示本地开发模式。
security:
  cors_origins:
    - "http://localhost:8000"
  auth_token: ""