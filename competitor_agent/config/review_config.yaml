# 竞品分析 Agent 配置文件
# 参考 doc/configuration.md 各字段含义与默认值。

# ===== 基础配置 =====
api_base_url: "https://ark.cn-beijing.volces.com/api/plan/v1"
model: "deepseek-v4-flash"
temperature: 0.1
max_tokens: 2048

# ===== LLM 可靠性（设计文档 36）+ 计价（设计文档 46）=====
# LLMClient 构造读取本 section（fallback_models/timeout/max_retries/pricing_per_1k），
# 重试与 fallback 透明生效；pricing_per_1k 为"美元/千 token"，按模型覆盖，缺省用内置近似。
llm:
  api_base_url: "https://ark.cn-beijing.volces.com/api/plan/v1"
  model: "deepseek-v4-flash"
  fallback_models: []          # 主模型重试耗尽后的回退模型链，如 ["deepseek-reasoner"]
  timeout: 120                 # 单次调用超时（秒，连接+读）
  max_retries: 3               # 可重试错误（429/5xx/连接/超时）每个模型的最大重试次数
  pricing_per_1k:              # 计价（美元/千 token）：换模型时覆盖以得准确成本展示
    input: 0.0003
    output: 0.0006

# ===== 预算（BudgetController）=====
budget:
  max_iterations: 10          # 战术循环最大迭代轮数
  max_parallel_subagents: 4   # 并行子代理上限
  token_high_water_mark: 120000  # 上下文 token 高水位，触发压缩
  token_compression_target: 80000 # 压缩后目标 token

# ===== 执行调度硬上限（设计文档 62 §3.8）=====
# 不再有 mode 决策开关：是否并行由 Lead 决策（delegate 的 parallel+reason），
# 代码只守硬上限（max_parallel_subagents = DelegateRunner 默认并发）。
execution:
  max_parallel_subagents: 4   # 并行子代理硬上限（= DelegateRunner.max_concurrent 默认）
  max_discover_candidates: 10 # 候选竞品数硬上限（delegate 工具内收敛）

# ===== 维度清单 =====
dimensions:
  enabled: [feature, pricing, performance, ecosystem, sentiment, roadmap]

# ===== 数据源 =====
collector:
  cache_ttl_seconds: 86400
  max_retries: 2
  timeout_seconds: 20
  rate_limit_per_second: 2   # 每源限速（ToolGuard）
  user_agent: "competitor-agent/0.1"
  # 外部源多源路由（设计文档 23）：默认关闭，保证无网络/无 Key 测试与 benchmark 不触发真实网络。
  # 有网络/Key 的真实运行环境打开 enable_external_sources 即可启用 GitHub/插件市场等外部源。
  enable_external_sources: true
  enable_github: true
  enable_marketplace: true
  enable_community: true
  enable_benchmark: true
  # 搜索引擎接入（设计文档 66 §3.1 + 71 §2.2）：DDG 免费主力（免 Key 恒可用）+ Tavily
  # 可选付费增强（配 TAVILY_API_KEY 才注册为降级池）。env TAVILY_API_KEY 只读不落盘。
  search_provider: "duckduckgo"   # 主力："duckduckgo"(免Key) | "tavily"(需Key)；Bocha 预留
  search_max_results: 8
  # 抓取层（设计文档 71 §7.2）：三级降级链 trafilatura→crawl4ai→jina_reader（默认两级，
  # crawl4ai 默认关）；FETCH_ENABLED=false = 纯搜索模式（短路抓取层）。env 优先级 > yaml。
  fetch_enabled: true
  fetch_max_per_run: 6            # 单跑抓取上限（懒触发防失控）
  fetch_max_chars: 8000           # 正文上限（对齐 max_content_chars）
  fetch_fallback_chain: ["trafilatura", "jina_reader"]  # 降级顺序；crawl4ai 启用后插入第 2 级
  crawler:
    headless: true                # == CRAWL4AI_HEADLESS（仅启用时生效）
    timeout: 30                   # == CRAWL4AI_TIMEOUT（单次抓取 + 空闲回收）
    browser_pool: 0               # 0=禁用该级；>0 且 extra+浏览器就绪才注册（1=单例）
  jina_reader:
    enabled: true                 # 云端兜底开关
  cache_ttl_search_hours: 24      # 搜索缓存 TTL（缺省沿用现有 cache_ttl_seconds=86400）
  cache_ttl_fetch_days: 7         # 正文缓存 TTL
  # 榜单结构化直连（设计文档 67 §2.1）：swebench | terminalbench | aider / 空=不启用。
  # 配合 enable_external_sources 主开关；performance 维度子 Agent 工具面自动加 benchmark_scores。
  # 设计文档 70 §8.4 D4a：官方 SWE-bench 榜单表最稳、与 coding agent 最相关 → 默认 swebench。
  benchmark_provider: "swebench"
  # 舆情采样源（设计文档 67 §2.2）：hackernews | reddit / 空=不启用。
  # sentiment 维度子 Agent 工具面自动加 sentiment_sampling（带样本量/时间窗）。
  # 设计文档 70 §8.4 D4b：公开免 Key、即启即用 → 默认 hackernews。
  sentiment_provider: "hackernews"

# ===== 记忆 =====
memory:
  enabled: true
  data_dir: "~/.competitor_agent"   # 记忆/凭据库根目录
  session_ttl_days: 30
  skills_max_per_competitor: 50
  evolution_window: 30              # L4 成功率统计窗口（天）

# ===== 报告 =====
report:
  include_confidence: true
  include_evidence_urls: true
  # 设计文档 70：output_dir 置空 = 项目默认 <项目根>/output（Web /api/settings 可改，
  # 持久化 <data_dir>/settings.json；优先级 显式 > settings > yaml > 项目默认）。
  output_dir: ""   # 空 = 项目 output/（旧值 ~/.competitor_agent/reports/competitor 读侧回退不迁移）
  lead_formatted_body: true   # 设计文档 70 M1：Lead 两段式 Final Answer（正文+JSON），关则全回退模板
  export_json: true          # 结构化 JSON 导出（设计文档 28），与 .md 同目录同名
  # 设计文档 70 §8.2 D2a/D2b：对比矩阵 JSON 已并入 output/comparison（恒派生自
  # resolve_output_dir 的 /comparison 子目录），不再读本键；置空并作兜底声明。
  # 旧目录（~/.competitor_agent/reports/comparison）读侧回退不迁移。无 settings.json 配置键。
  comparison_dir: ""
  # 产品化闭环（设计文档 67 §3）：HTML 自包含分享 + 审批门 + 告警推送
  export_html: false         # 报告落盘后自动导出单文件自包含 HTML（§3.1，可选触发）
  approval_enabled: true     # human-in-the-loop 审批门（§3.2）：触发规则 → pending_review
  approval_low_confidence_threshold: 0.4   # 任一维度 PARTIAL / 整体低置信触发阈值
  alert_webhooks: []         # 告警推送 webhook 列表（§3.3，企业微信/钉钉/飞书机器人 URL）
  alert_email: {}            # 邮件推送（host/port/from/to；空 = 不启用）

# ===== 新鲜度 / 陈旧度（设计文档 26）=====
freshness:
  dimension_ttl_days:
    pricing: 7
    performance: 14
    feature: 30
    ecosystem: 30
    sentiment: 7
    roadmap: 14
  refresh_check_enabled: true    # refresh_stale 定时重爬开关

# ===== 多 Agent LLM 主导编排（设计文档 49）=====
# analyze() 主路径 = Lead ReAct 编排：make_plan → delegate 维度子 Agent → 复核工具 → Final Answer。
# 安全兜底（url_guard/注入防护/预算/取消/checkpoint/聚合渲染）保持代码，不进 LLM。
subagents:
  enabled: true            # analyze() 主路径 = Lead ReAct 编排
  # 设计文档 70 §8.4 D4c：无搜索/榜单下靠多次 web_extract 采集加长 → 300s（覆盖真实 2-5min 耗时）
  timeout_seconds: 300      # 子 Agent 单次执行超时（并发硬上限见 execution.max_parallel_subagents）
tools:
  validate_facts: true     # 复核工具（事实/数值冲突核验）注册
  detect_conflict: true    # 跨维度冲突检测工具注册
  check_freshness: true    # 新鲜度查询工具注册
  select_source: true      # 选源工具注册（确定性候选由代码生成）

# ===== ReAct 循环（设计文档 56）=====
agent:
  max_history_steps: 8     # 子 Agent 工具步超过后折叠旧步为摘要（默认 8，不设 = 现状不变）

# ===== Lead 编排（设计文档 62 §3.8）=====
# 迭代次数限制已移除（Lead max_steps=None 无限循环，靠 LLM 自然收敛 Final Answer）
lead:
  max_history_steps: 12         # Lead 上下文压缩保留步数（透传 ReactAgent._compress_history）

# ===== 内置调度器 + 周报（设计文档 67 §2.3）=====
# 外部 cron 仍可用（cli schedule 已是 cron 入口）；内置调度器为可选补充，二者互斥由配置决定。
schedule:
  enabled: false               # Web 启动时自动 start() 内置调度器
  interval_hours: 24           # interval 模式唤醒间隔（小时）
  cron_expr: ""                # cron 模式（minute hour day month weekday），优先于 interval
  weekly_window_days: 7        # 周报聚合窗口（天）
  weekly_report: false         # run_scheduled 末尾是否触发周报聚合（<data_dir>/reports/weekly/）

# ===== 可观测性 =====
observability:
  log_level: "INFO"

# ===== 安全（Web/MCP）=====
# auth_token 优先从环境变量 COMPETITOR_AUTH_TOKEN 读取，此处留空表示本地开发模式。
security:
  cors_origins:
    - "http://localhost:8000"
  auth_token: ""