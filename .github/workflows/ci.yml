name: CI

on:
  push:
    branches: [main]
    paths:
      - "competitor_agent/**"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "competitor_agent/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"

defaults:
  run:
    working-directory: competitor_agent

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy .

      - name: Test with pytest
        run: pytest -v --tb=short --cov=competitor_agent --cov-report=term-missing

      - name: Generate benchmark report
        # 设计文档 55 M1：--gate 门禁执法——质量退化（field_accuracy/幻觉率/工具选择/trace/行为门禁）CI 变红
        run: python -m competitor_agent.evaluation.benchmark --gate --out reports/benchmark.csv --report reports/benchmark.md

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

      - name: Upload benchmark report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports

  docker:
    # 设计文档 55 M2：构建双 target + 容器内 smoke；不推镜像（仓库是叙事载体）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slim image
        working-directory: ${{ github.workspace }}
        run: docker build --target slim -t competitor-agent:slim .

      - name: Build full image
        working-directory: ${{ github.workspace }}
        run: docker build --target full -t competitor-agent:full .

      - name: Smoke test (slim)
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm competitor-agent:slim python -c "import competitor_agent"
          docker run --rm competitor-agent:slim python -m competitor_agent.web_app --help

      - name: Smoke test (full)
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm competitor-agent:full python -c "import competitor_agent"
          docker run --rm competitor-agent:full python -c "import chromadb, sentence_transformers, numpy, pandas"
          docker run --rm competitor-agent:full python -m competitor_agent.web_app --help
