name: CI

on:
  push:
    branches: [main]
    paths:
      - "competitor_agent/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "competitor_agent/**"

defaults:
  run:
    working-directory: competitor_agent

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy .

      - name: Test with pytest
        run: pytest -v --tb=short --cov=competitor_agent --cov-report=term-missing

      - name: Generate benchmark report
        run: python -m competitor_agent.evaluation.benchmark --out reports/benchmark.csv --report reports/benchmark.md

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

      - name: Upload benchmark report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports
