[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dota_helper"
version = "0.1.0"
description = "Dota 2 赛后复盘 Agent 模块"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "httpx>=0.23.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.setuptools.packages.find]
include = ["dota_helper*"]
where = ["."]
namespaces = false

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
    "python-dotenv>=1.0",
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
crawler = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.23.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["dota_helper"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
